<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Song Library</title>
    <link rel="stylesheet" href="../universalStyle.css">
    <link rel="stylesheet" href="./songLibraryStyle.css">
</head>
<body>
    <div id="header">
        <button id="songPageBTN" class="active">Songs</button>
        <button id="playlistPageBTN">Playlists</button>
    </div>

    <div id="search-div">
        <input type="search" placeholder="Search song from library" id="search-bar">
    </div>
    
    <div id="body">
        <div class="song-div">
            <div class="left">
                <img alt="song image">
                <div class="songInfo">
                    <p>song name</p>
                    <p>artist name</p>
                </div>
            </div>
            <div class="right">
                <button class="option">...</button>
                <p>1:20</p>
            </div>
        </div>
    </div>
</body>
</html>
